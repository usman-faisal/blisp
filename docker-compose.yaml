services:
  postgres:
    image: postgres:18-alpine
    container_name: blisp-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: blisp
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a version-specific subdirectory, so the
      # mount must be at /var/lib/postgresql (not .../data, which 18 rejects).
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:alpine
    container_name: blisp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
